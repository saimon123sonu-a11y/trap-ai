name: Alpha Trap EOD recovery bootstrap
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/eod-recovery.yml"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: alpha-trap-eod-recovery
  cancel-in-progress: true
jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - name: Fetch real public EOD history
        run: node scripts/refresh-eod-fallback.mjs
      - name: Validate prices, history and safety flags
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          const p=JSON.parse(fs.readFileSync("data/latest.json","utf8"));
          const rows=Object.values(p.symbols||{});
          const valid=rows.filter(r=>r&&Number.isFinite(r.price)&&r.price>0&&r.asOf&&Array.isArray(r.history)&&r.history.length>=2&&r.dataStatus==="EOD_PUBLIC_HISTORY");
          if(valid.length<20) throw new Error("Expected >=20 real historical price rows, got "+valid.length);
          if(p.refreshStatus!=="EOD_BASELINE_ONLY"||p.intradayAvailable!==false||p.liveSignalsEnabled!==false) throw new Error("EOD safety flags invalid");
          console.log(JSON.stringify({status:"PASS",provider:p.provider,generatedAt:p.generatedAt,validPrices:valid.length,coverage:p.coverage,liveSignalsEnabled:p.liveSignalsEnabled,intradayAvailable:p.intradayAvailable}));
          '
      - name: Persist snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "Snapshot already current"
          else
            git commit -m "Bootstrap Alpha Trap with verified public EOD history"
            git push
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        uses: actions/deploy-pages@v4
