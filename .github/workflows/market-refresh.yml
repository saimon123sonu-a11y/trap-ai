name: TRAP AI public market snapshot
on:
  push:
    branches: ["main"]
    paths:
      - "scripts/refresh-market.mjs"
      - ".github/workflows/market-refresh.yml"
      - "app.js"
      - "index.html"
      - "styles.css"
      - "engine.js"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trap-ai-pages-refresh
  # Collection may take longer than one five-minute cycle when public relays throttle.
  # Never cancel an in-progress validated snapshot just because the next cron tick arrives.
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Explain source validation policy
        run: |
          echo "The collector validates actual chart payloads per symbol."
          echo "No standalone probe burst is run, to avoid consuming public relay rate limits."

      - name: Build public market snapshot
        run: node scripts/refresh-market.mjs

      - name: Persist latest market snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit"
          else
            git commit -m "Update TRAP AI market snapshot"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
