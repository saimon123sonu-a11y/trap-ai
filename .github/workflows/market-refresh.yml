name: Alpha Trap public market snapshot
on:
  push:
    branches: ["main"]
    paths:
      - "scripts/refresh-market.mjs"
      - "scripts/refresh-eod-fallback.mjs"
      - ".github/workflows/market-refresh.yml"
      - "alpha.js"
      - "alpha.css"
      - "index.html"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: alpha-trap-pages-refresh
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Validate primary public market collector
        id: primary
        continue-on-error: true
        run: timeout 90s node scripts/refresh-market.mjs

      - name: Use public EOD fallback if primary feed fails
        if: steps.primary.outcome == 'failure'
        run: node scripts/refresh-eod-fallback.mjs

      - name: Validate published snapshot
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          const p=JSON.parse(fs.readFileSync("data/latest.json","utf8"));
          if (!p || typeof p!=="object" || !p.symbols || typeof p.symbols!=="object") throw new Error("snapshot schema invalid");
          const valid=Object.values(p.symbols).filter(v=>v && Number.isFinite(v.price) && v.price>0 && v.asOf && v.dataStatus!=="DATA_UNAVAILABLE");
          if (valid.length < 20) throw new Error("fewer than 20 validated prices: "+valid.length);
          if (p.refreshStatus==="EOD_BASELINE_ONLY" && p.liveSignalsEnabled!==false) throw new Error("EOD fallback must keep live signals disabled");
          console.log(JSON.stringify({snapshotStatus:p.refreshStatus||"PRIMARY",validPrices:valid.length,generatedAt:p.generatedAt,provider:p.provider||"primary public collector",liveSignalsEnabled:p.liveSignalsEnabled??"primary collector policy"}));
          '

      - name: Persist latest market snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit"
          else
            git commit -m "Update Alpha Trap public market snapshot"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
