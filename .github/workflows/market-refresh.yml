name: TRAP AI public market snapshot
on:
  push:
    branches: ["main"]
    paths:
      - "scripts/refresh-market.mjs"
      - ".github/workflows/market-refresh.yml"
      - "app.js"
      - "index.html"
      - "styles.css"
      - "engine.js"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: trap-ai-pages-refresh
  cancel-in-progress: true

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Probe public market endpoint
        run: |
          curl -L --silent --show-error --max-time 15 -o /tmp/yahoo.json -w "Yahoo_HTTP=%{http_code}\n" "https://query1.finance.yahoo.com/v8/finance/chart/BTC-USD?range=1mo&interval=1d"
          head -c 120 /tmp/yahoo.json || true
          echo
          for U in \
            "https://api.allorigins.win/raw?url=https%3A%2F%2Fquery1.finance.yahoo.com%2Fv8%2Ffinance%2Fchart%2FBTC-USD%3Frange%3D1mo%26interval%3D1d" \
            "https://corsproxy.io/?url=https%3A%2F%2Fquery1.finance.yahoo.com%2Fv8%2Ffinance%2Fchart%2FBTC-USD%3Frange%3D1mo%26interval%3D1d"; do
            echo "PROXY=$U"
            curl -L --silent --show-error --max-time 20 -o /tmp/proxy.json -w "HTTP=%{http_code}\n" "$U" || true
            head -c 160 /tmp/proxy.json || true
            echo
          done
          echo "PROXY=JINA"
          curl -L --silent --show-error --max-time 20 -o /tmp/jina.json -w "HTTP=%{http_code}\n" "https://r.jina.ai/https://query1.finance.yahoo.com/v8/finance/chart/BTC-USD?range=1mo&interval=1d" || true
          head -c 300 /tmp/jina.json || true
          echo

      - name: Build public market snapshot
        run: node scripts/refresh-market.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
